<header
    x-data="{ open: false, scrolled: false }"
    @scroll.window="scrolled = window.pageYOffset > 20"
    :class="scrolled
        ? 'bg-slate-900/95 shadow-lg'
        : 'bg-transparent'"
    class="fixed inset-x-0 top-0 z-50 transition-all duration-300">

    <div class="max-w-7xl mx-auto px-6">

        <div class="h-20 flex items-center justify-between">

            <a href="/" class="text-2xl font-bold text-white">
                Bonomi Ukraine
            </a>

            <nav class="hidden md:flex gap-8">

                <a href="#" class="text-white hover:text-blue-400 transition">
                    Home
                </a>

                <a href="#" class="text-white hover:text-blue-400 transition">
                    About
                </a>

                <a href="#" class="text-white hover:text-blue-400 transition">
                    Services
                </a>

                <a href="#" class="text-white hover:text-blue-400 transition">
                    Contact
                </a>

                <a href="{% url 'cart:cart_detail' %}"
   class="flex items-center gap-2 bg-cyan-500 hover:bg-cyan-400 text-white px-4 py-2 rounded-xl transition">
    <span>🛒</span>
    <span>Корзина</span>
    <span class="bg-white text-cyan-600 text-sm px-2 py-0.5 rounded-full font-bold">
        {{ cart|length }}
    </span>
</a>

            </nav>

            <button
                class="md:hidden text-white"
                @click="open = !open">

                ☰

            </button>

        </div>

    </div>

    <div
        x-show="open"
        x-transition
        class="md:hidden bg-slate-900">

        <nav class="flex flex-col p-6 space-y-4">

            <a href="#" class="text-white">Home</a>
            <a href="#" class="text-white">About</a>
            <a href="#" class="text-white">Services</a>
            <a href="#" class="text-white">Contact</a>

        </nav>

    </div>

</header>
